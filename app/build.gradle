plugins { id 'com.android.application' }

def ksFile = rootProject.file('keystore/cybnate.jks')

android {
    namespace 'com.cybnate.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cybnate.app'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword 'cybnate-release'
                keyAlias 'cybnate'
                keyPassword 'cybnate-release'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    // Google sign-in for the Gmail / Drive / Calendar integrations (AuthorizationClient)
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    testImplementation 'junit:junit:4.13.2'
}
