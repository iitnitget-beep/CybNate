<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1c">
<title>CybNate</title>
<link rel="stylesheet" href="vendor/hljs.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <button class="icon" id="btnMenu" aria-label="Menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></svg></button>
    <div class="title" id="title">New chat</div>
    <button class="icon sm" id="btnTerm" aria-label="Terminal"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="m7 10 3 2.5L7 15M13 15h4"/></svg></button>
    <button class="icon sm" id="btnFiles" aria-label="Files"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.5h7.5A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg><span id="fileBadge" class="badge" hidden></span></button>
    <button class="icon" id="btnNew" aria-label="New chat"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5V12"/><path d="M18.4 2.9a2 2 0 0 1 2.8 2.8L12 15l-4 1 1-4z"/></svg></button>
  </header>
  <main id="messages"></main>
  <footer>
    <div id="status"></div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask CybNate to build…   / commands · @file"></textarea>
      <div class="crow">
        <button id="btnModel" class="sel"></button>
        <button id="btnMode" class="sel"></button>
        <span class="grow"></span>
        <button class="icon" id="btnAttach" aria-label="Attach files"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button id="btnSend" aria-label="Send"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      </div>
    </div>
  </footer>
</div>

<div id="scrim" hidden></div>
<nav id="agents" hidden></nav>
<aside id="drawer" hidden>
  <div class="drawer-head"><span class="word"><svg class="mark" viewBox="0 0 48 48" width="48" height="48" fill="currentColor"><path d="M8 8h32v10H18v12h22v10H8z"/><path d="M24 21h9v6h-9z" opacity=".55"/></svg>CybNate</span><button class="icon" id="dSearch" aria-label="Search chats"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button></div>
  <input type="text" id="dFilter" class="field" placeholder="Search chats" hidden>
  <button class="drow" id="dNew"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5V12"/><path d="M18.4 2.9a2 2 0 0 1 2.8 2.8L12 15l-4 1 1-4z"/></svg><span>New chat</span></button>
  <button class="drow" id="dProject"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.5h7.5A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><path d="M12 11v5M9.5 13.5h5"/></svg><span>New project</span></button>
  <button class="drow" id="dFiles"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.5h7.5A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg><span>Workspace files</span><b id="dCount" class="count"></b></button>
  <button class="drow" id="dTerm"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="m7 10 3 2.5L7 15M13 15h4"/></svg><span>Terminal</span></button>
  <button class="drow" id="dGit"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="9" r="2.2"/><path d="M6 8.2v7.6M18 11.2c0 3-6 2-9.5 4.6"/></svg><span>GitHub</span></button>
  <button class="drow" id="dInt"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v5M15 3v5M7 8h10v4a5 5 0 0 1-10 0zM12 17v4"/></svg><span>Integrations</span></button>
  <div class="label">Chats</div>
  <div id="chatList"></div>
  <div class="drawer-foot"><small id="ver"></small><button class="icon" id="dSettings" aria-label="Settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
</aside>

<section class="sheet" id="sheet" hidden>
  <div class="sheet-head">
    <div id="sheetTitle" class="title"></div>
    <div id="sheetActions"></div>
  </div>
  <div id="sheetBody"></div>
  <button class="icon fab" id="sheetBack" aria-label="Back"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
</section>

<input type="file" id="filePick" multiple hidden>
<div id="toast" hidden></div>
<template id="tplLogo"><svg class="mark" viewBox="0 0 48 48" width="48" height="48" fill="currentColor"><path d="M8 8h32v10H18v12h22v10H8z"/><path d="M24 21h9v6h-9z" opacity=".55"/></svg></template>

<script src="vendor/marked.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="safety.js"></script>
<script src="orchestra.js"></script>
<script src="devtools.js"></script>
<script src="url-policy.js"></script>
<script src="core.js"></script>
<script src="agent-runtime.js"></script>
<script src="planner.js"></script>
<script src="plugin-registry.js"></script>
<script src="github.js"></script>
<script src="integrations.js"></script>
<script src="wire.js"></script>
<script src="backend.js"></script>
<script src="cli.js"></script>
<script src="webtest.js"></script>
<script src="project-preview.js"></script>
<script src="app.js"></script>
</body>
</html>
