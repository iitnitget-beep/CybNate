name: Build APK
on:
  push:
    branches: ['**']
    paths-ignore: ['release/**', 'keystore/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CYBNATE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CYBNATE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.CYBNATE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/cybnate.jks
          else
            echo "::warning::Signing secrets are missing or incomplete; this build is debug-signed and cannot update an installed copy."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repository audit
        run: bash scripts/audit.sh

      - name: Agent core and safety tests
        run: |
          set -e
          node tests/cleartext.test.js
          for t in core safety orchestra router devtools engine cli project-index plugin-registry; do node tests/$t.test.js; done
          bash tests/selftest-report.test.sh
          # the backend: a real server on a local port with real bash, python and git; then, as root, that users are kept apart
          node server/test/server.test.js
          sudo env "PATH=$PATH" node server/test/isolation.test.js
          # Install the pinned test-only DOM dependency from package-lock.json.
          npm ci
          for t in webtest.test integrations.test signin.test backend.test engine.ui.test auto.test router.ui.test preview.test ui.smoke; do node tests/$t.js; done

      - name: Fetch bundled Python runtime (Pyodide)
        run: bash scripts/fetch-vendor.sh

      - name: Unit tests and release APK
        env:
          CYBNATE_KEYSTORE_PATH: keystore/cybnate.jks
          CYBNATE_KEY_ALIAS: cybnate
          CYBNATE_STORE_PASSWORD: ${{ secrets.CYBNATE_STORE_PASSWORD }}
          CYBNATE_KEY_PASSWORD: ${{ secrets.CYBNATE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease

      - name: Publish APK to the branch
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/CybNate.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/CybNate.apk
          git commit -m "build: CybNate APK #${{ github.run_number }} [skip ci]" || exit 0
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: CybNate-apk
          path: release/CybNate.apk

  # Runs the real APK on an Android emulator: shell, Python, JavaScript, live free-model call, web search.
  device-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/device-test.sh
      - name: Publish results to the branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/selftest.txt release/device-console.txt release/model-raw.txt release/*.png || true
          git commit -m "test: on-device self test #${{ github.run_number }} [skip ci]" || exit 0
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
      - name: Upload device diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CybNate-device-diagnostics
          path: |
            release/selftest.txt
            release/device-console.txt
            release/model-raw.txt
            release/screenshot-home.png
            release/screenshot-home2.png
            release/screenshot-selftest.png
            release/screenshot-chat.png
          if-no-files-found: warn
      - name: Validate complete device self-test report
        if: always()
        run: bash scripts/check-selftest.sh release/selftest.txt
